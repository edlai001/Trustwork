<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustWork - freelance escrow</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<script src="config.js"></script>
<script src="contract.js"></script>
<script src="wallet.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="./">Trust<span>Work</span></a>
    <nav>
      <span class="pill">Sepolia testnet</span>
      <span class="pill" id="account" hidden></span>
      <button id="connectBtn">Connect wallet</button>
    </nav>
  </header>
  <p class="tagline">Freelance escrow: the client's ETH is locked in a smart contract and released to the freelancer when the work is approved.</p>

  <div id="notice" class="notice info" role="status" aria-live="polite">Connect your MetaMask wallet to create or take jobs.</div>

  <section class="card" id="createCard">
    <h2>Post a job (you are the client)</h2>
    <div class="row">
      <div><label for="desc">What needs to be done?</label><input id="desc" placeholder="e.g. Design a logo"></div>
      <div><label for="amount">Payment (ETH)</label><input id="amount" type="number" min="0" step="0.001" placeholder="0.01"></div>
    </div>
    <button id="createBtn">Create job and lock ETH</button>
  </section>

  <section class="card">
    <div class="jobs-head">
      <h2>Jobs</h2>
      <button class="secondary" id="refreshBtn">Refresh</button>
    </div>
    <p id="earned" class="empty" hidden></p>
    <div id="jobs"><p class="empty">Loading…</p></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
// Status names in the same order as the Solidity enum
const STATUS = ["Open", "In progress", "Submitted", "Completed", "Cancelled"];
const ADDRESS = getContractAddress();
let wallet = null;   // { signer, address, provider } after connecting
let contract = null; // contract object (read-only until a wallet is connected)

// Small helper to build HTML elements safely (text is never parsed as HTML).
function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function setupContract() {
  // Before connecting we read through a public Sepolia node, so anyone can see the jobs.
  const runner = wallet ? wallet.signer : new ethers.JsonRpcProvider(CFG.network.rpcUrls[0]);
  contract = new ethers.Contract(ADDRESS, ABI, runner);
}

// ---------- Show jobs ----------
async function loadJobs() {
  const list = $("jobs");
  try {
    const count = Number(await contract.jobCount());
    if (count === 0) { list.replaceChildren(el("p", { className: "empty", textContent: "No jobs yet. Post the first one above." })); return; }
    const ids = [];
    for (let id = count; id >= 1 && ids.length < 20; id--) ids.push(id); // newest 20
    const jobs = await Promise.all(ids.map((id) => contract.jobs(id)));
    list.replaceChildren(...jobs.map((job, i) => jobCard(ids[i], job)));
    if (wallet) {
      const earned = await contract.totalEarned(wallet.address);
      $("earned").textContent = `You have earned ${ethers.formatEther(earned)} ETH as a freelancer.`;
      $("earned").hidden = false;
    }
  } catch (e) {
    list.replaceChildren(el("p", { className: "empty", textContent: "Could not load jobs: " + friendlyError(e) }));
  }
}

function who(addr) {
  if (addr === ethers.ZeroAddress) return "nobody yet";
  return wallet && addr.toLowerCase() === wallet.address.toLowerCase() ? "You" : shortAddr(addr);
}

function jobCard(id, job) {
  const status = Number(job.status);
  const amount = status >= 3 ? "paid out / returned" : ethers.formatEther(job.amount) + " ETH locked";

  // Work link: only show http(s) links as clickable
  let work = job.workLink || "—";
  if (/^https?:\/\//i.test(job.workLink)) work = el("a", { href: job.workLink, target: "_blank", rel: "noopener", textContent: job.workLink });

  const card = el("article", { className: "job" },
    el("div", { className: "job-top" },
      el("strong", { textContent: "Job #" + id }),
      el("span", { className: "badge s" + status, textContent: STATUS[status] })),
    el("p", { className: "job-title", textContent: job.description || "(no description)" }),
    el("dl", {},
      el("dt", { textContent: "Payment" }), el("dd", { textContent: amount }),
      el("dt", { textContent: "Client" }), el("dd", { textContent: who(job.client) }),
      el("dt", { textContent: "Freelancer" }), el("dd", { textContent: who(job.freelancer) }),
      el("dt", { textContent: "Work" }), el("dd", {}, work)));

  const actions = actionsFor(id, job, status);
  if (actions.length) card.append(el("div", { className: "job-actions" }, ...actions));
  return card;
}

// Show only the buttons that the connected account is allowed to use right now.
function actionsFor(id, job, status) {
  if (!wallet) return [];
  const me = wallet.address.toLowerCase();
  const isClient = job.client.toLowerCase() === me;
  const isFreelancer = job.freelancer.toLowerCase() === me;
  const button = (text, onclick, cls = "") => el("button", { textContent: text, onclick, className: cls });

  if (status === 0 && isClient) return [button("Cancel and refund me", () => act("Cancelling job", () => contract.cancelJob(id)), "secondary")];
  if (status === 0) return [button("Accept this job", () => act("Accepting job", () => contract.acceptJob(id)))];
  if (status === 1 && isFreelancer) {
    const input = el("input", { placeholder: "Link to your finished work" });
    return [input, button("Submit work", () => act("Submitting work", () => contract.submitWork(id, input.value.trim())))];
  }
  if (status === 2 && isClient) return [button("Approve and pay freelancer", () => act("Paying freelancer", () => contract.approveWork(id)))];
  return [];
}

// Run a transaction, disable buttons while it is pending, then refresh the list.
async function act(label, makeTx) {
  document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  const receipt = await sendTx(label, makeTx);
  document.querySelectorAll("button").forEach((b) => (b.disabled = false));
  if (receipt) await loadJobs();
  return receipt;
}

// ---------- Buttons ----------
$("connectBtn").onclick = async () => {
  wallet = await connectWallet();
  if (!wallet) return;
  notify("Wallet connected. You can post a job or take one below.", "ok");
  setupContract();
  loadJobs();
};

$("createBtn").onclick = async () => {
  if (!wallet) return notify("Connect your wallet first.", "error");
  const description = $("desc").value.trim();
  const amount = $("amount").value.trim();
  if (!description || !(Number(amount) > 0)) return notify("Enter a description and an amount greater than 0.", "error");
  const ok = await act("Creating job", () => contract.createJob(description, { value: ethers.parseEther(amount) }));
  if (ok) { $("desc").value = ""; $("amount").value = ""; }
};

$("refreshBtn").onclick = () => loadJobs();

// ---------- Start ----------
if (!ADDRESS) {
  notify("The contract is not deployed yet. Open the Deploy page first.", "error");
  $("jobs").replaceChildren(el("p", {}, "No contract address. ", el("a", { href: "deploy.html", textContent: "Go to the Deploy page →" })));
  $("createCard").hidden = true;
} else {
  setupContract();
  loadJobs();
  $("footer").append("Contract: ", el("a", { href: `${EXPLORER}/address/${ADDRESS}`, target: "_blank", rel: "noopener", textContent: ADDRESS }),
    " · ", el("a", { href: "deploy.html", textContent: "Deploy page" }));
}
</script>
</body>
</html>
